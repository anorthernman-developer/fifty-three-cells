<title>Fifty-Three Cells · a live process-music machine for up to 12 players, with visuals for the big screen</title>
<meta name="description" content="Fifty-Three Cells: up to twelve players walk through fifty-three short cells over a steady pulse, at their own speed. Your own samples with start and end trim, and a live visuals output for a projector or signage screen. A homage to the 1964 minimalist piece In C; no score is reproduced.">

<body class="lay-split"><noscript>This music machine needs JavaScript and Web Audio (Chrome or Edge).</noscript>
<main id="mm-stage"><div id="view"><canvas id="cv"></canvas></div>
<div id="side"><div class="bt"><button id="b-u">U · unison</button><button id="b-e">E · ending</button><button id="b-n">N · new cells</button><button id="b-r">0 · restart</button><button id="b-p">P · pulse</button></div>
<h3>Ensemble</h3><div id="c0"></div><h3>The rules</h3><div id="c1"></div><h3>Colour</h3><div id="c2"></div>
<h3>Cell editor</h3><div><span id="cellno">CELL 1</span> · click a cell on the strip, then type semitones:eighths (- for a rest)<br><input id="cell" type="text" spellcheck="false"><div class="bt" style="margin-top:4px"><button id="b-prev">◀</button><button id="b-next">▶</button><button id="b-hear">Hear</button></div></div></div></main>
